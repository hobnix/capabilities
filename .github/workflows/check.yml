name: check
on:
  push:
    branches: [develop, main, "feature/**", "fix/**"]
  pull_request:
env:
  # the core checkout the packages are validated against (change it when the core lives elsewhere)
  CORE_REPOSITORY: hobnix/server
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the core ref (branch of the same name, else develop)
        id: core
        env:
          GH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=develop
          if git ls-remote --exit-code --heads "https://github.com/$CORE_REPOSITORY.git" "$GH_REF" >/dev/null 2>&1; then ref=$GH_REF; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ steps.core.outputs.ref }}
          path: core
      - name: Log the core commit
        run: echo "core $CORE_REPOSITORY@${{ steps.core.outputs.ref }} $(git -C core rev-parse HEAD)"
      - name: Does the core know kind = "capability"?
        id: kind
        run: |
          if grep -E '^KINDS *=' core/scripts/pkg.py | grep -q '"capability"'; then
            echo "known=1" >> "$GITHUB_OUTPUT"
          else
            echo "known=0" >> "$GITHUB_OUTPUT"
            echo "::warning::core scripts/pkg.py has no kind capability yet (hobnix/server plan step 1): validate and repo-check are skipped; a package in index.toml fails this job until the core knows the kind"
          fi
      - name: index.toml parses
        run: python3 -I -c 'import tomllib; tomllib.load(open("index.toml","rb"))'
      - name: No package before the core can check it
        if: steps.kind.outputs.known == '0'
        run: |
          n=$(python3 -I -c 'import tomllib; print(len(tomllib.load(open("index.toml","rb")).get("package", {})))')
          if [ "$n" != 0 ] || [ -n "$(find capabilities -name package.toml 2>/dev/null)" ]; then
            echo "this repository has packages but the core cannot validate kind capability yet" >&2; exit 1
          fi
      - name: Manifests and index
        if: steps.kind.outputs.known == '1'
        run: |
          mkdir tree && ln -s "$PWD/capabilities" "tree/capabilities"
          HS_PACKAGES_ROOT="$PWD/tree" python3 -I core/scripts/pkg.py validate
          python3 -I core/scripts/pkg.py repo-check .
      - name: Shell syntax
        run: for f in capabilities/*/*.sh tests/*.sh; do [ -f "$f" ] && bash -n "$f"; done; true
      - name: Tests (against the core checked out above)
        run: HS_CORE="$PWD/core" HS_TEST_CI=1 bash tests/run-all.sh
